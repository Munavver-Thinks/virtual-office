<!doctype html>
<html lang="en" class="ao-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Virtual Office</title>
<script>try{var p=localStorage.getItem("ao-theme"),l=p==="light"||(p==="system"&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.className=l?"ao-light":"ao-dark"}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%232DD4BF%27 stroke-width=%272%27 stroke-linejoin=%27round%27><path d=%27M12 2.8l8.5 4.9v8.6L12 21.2l-8.5-4.9V7.7zM3.5 7.7L12 12.6l8.5-4.9M12 12.6v8.6%27/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/components.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .login { display: grid; gap: 14px; width: min(420px, 100%); box-sizing: border-box; padding: 24px; }
  .login h1 { margin: 0; }
  .login label { font-weight: 600; }
  .login input { min-height: var(--h-btn); box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg-2); color: var(--text); font-family: var(--font-mono); }
  .login p { margin: 0; }
  .login .err { min-height: 1.3em; color: var(--red-t); font-size: 13px; }
  .login .ao-btn { justify-self: end; }
</style>
</head>
<body>
<form class="ao-panel login" id="f">
  <h1 class="ao-name">Virtual Office</h1>
  <label for="token">Access token</label>
  <input type="text" id="token" autocomplete="off" spellcheck="false" aria-describedby="token-hint err">
  <p class="ao-meta" id="token-hint">Run <code class="ao-mono">agent-office token</code> on the server to see it.</p>
  <p class="err" id="err" role="alert"></p>
  <button class="ao-btn ao-btn--primary" type="submit" id="go">Sign in</button>
</form>
<script>
  const err = document.getElementById("err"), input = document.getElementById("token"), go = document.getElementById("go");
  /** While a sign-in is out the button is off and says so, so a double click sends it once. When it fails, focus goes
   *  back to the field (a button turned off loses it). */
  const busy = (on) => { go.disabled = on; go.textContent = on ? "Signing in…" : "Sign in"; if (!on) input.focus(); };
  input.addEventListener("input", () => (err.textContent = ""));
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (go.disabled) return;
    if (!input.value.trim()) { err.textContent = "Enter the token first."; return; }
    busy(true);
    let r;
    try { r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: input.value.trim() }) }); }
    catch { err.textContent = "Couldn't reach the server. Check that it's running, then try again."; busy(false); return; }
    if (r.ok) { location.href = "/"; return; } // stays off while the dashboard loads
    err.textContent = (await r.json().catch(() => ({}))).error || "Sign in failed.";
    busy(false);
  });
</script>
</body>
</html>
