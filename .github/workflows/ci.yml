name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      # Every OS and Node version reports its own result: one failure doesn't cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    # The suite takes under a minute (about two on Node 18); a hung test fails the job here, not after 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
